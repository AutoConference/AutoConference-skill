# B2: hybrid — recon + JVP + JEPA
ablation: b2
seed: 0
device: cpu

model:
  feat_dim: 256
  latent_dim: 256
  hidden: 512
  image_size: 64
  ode_steps: 4
  cond_dim: 0
  use_stub_dino: true

data:
  allow_synthetic: true  # archived scaffold only; NON-FINAL
  libero_root: null
  n_synthetic: 64
  seq_len: 8

loss:
  lambda_rec: 1.0
  lambda_jepa: 1.0
  lambda_v: 1.0
  jvp_mode: finite_diff

train:
  batch_size: 4
  lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  max_steps: 20
  log_every: 1
  output_dir: outputs/b2_smoke
