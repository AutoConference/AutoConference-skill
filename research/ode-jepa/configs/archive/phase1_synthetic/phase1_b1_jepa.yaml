# Phase-1 B1: recon + JEPA (proposed; synthetic LIBERO stand-in)
ablation: b1
seed: 0
device: cuda:0
protocol_note: >
  Synthetic stand-in for LIBERO subset — LIBERO HDF5 not present on machine
  and loader not wired. Longer sequences / more steps than smoke for phase-1
  comparison of collapse and open-loop drift.

model:
  feat_dim: 256
  latent_dim: 256
  hidden: 512
  image_size: 64
  ode_steps: 8
  cond_dim: 0
  use_stub_dino: true

data:
  allow_synthetic: true  # archived scaffold only; NON-FINAL
  libero_root: null
  n_synthetic: 256
  n_synthetic_eval: 64
  seq_len: 16

loss:
  lambda_rec: 1.0
  lambda_jepa: 1.0
  lambda_v: 0.0
  jvp_mode: finite_diff

train:
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  max_steps: 250
  log_every: 10
  eval_every: 50
  output_dir: outputs/phase1
  ckpt_name: b1_phase1.pt
  metrics_name: metrics_b1.json
  summary_name: b1_phase1_summary.json
